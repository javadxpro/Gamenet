<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="صفحه‌ای که دنبالش بودید پیدا نشد — گیم نت.">
    <meta property="og:title" content="صفحه پیدا نشد | گیم نت">
    <meta property="og:description" content="صفحه‌ای که دنبالش بودید پیدا نشد — گیم نت.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <title>صفحه پیدا نشد | گیم نت</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="Webstyle.css">
    <style>
        .error-wrap {
            text-align: center;
            padding: 4rem 1rem 3rem;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #ff6a00;
            text-shadow: 0 0 30px rgba(255, 106, 0, 0.4);
            direction: ltr;
        }
        .error-text {
            color: #aaa;
            margin: 1rem 0 2rem;
            font-size: 1.1rem;
        }
        .error-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 106, 0, 0.85);
            background-image: linear-gradient(165deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0) 75%);
            color: #fff;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            border-radius: 1rem;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px) saturate(1.3);
            -webkit-backdrop-filter: blur(12px) saturate(1.3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 6px 22px rgba(255, 106, 0, 0.22);
            transition: transform 0.25s, box-shadow 0.25s, background-image 0.25s;
        }
        .error-home:hover {
            transform: translateY(-3px);
            background-image: linear-gradient(165deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.08) 45%, rgba(255,255,255,0) 75%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 10px 30px rgba(255, 106, 0, 0.42);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="error-wrap">
        <div class="error-code">404</div>
        <div class="error-text">😕 به نظر می‌رسه این صفحه جابه‌جا شده یا دیگر وجود نداره.</div>
        <a class="error-home" href="shop-index.html"><svg class="gi" aria-hidden="true"><use href="icons.svg#ic-home"></use></svg> بازگشت به فروشگاه</a>
    </div>
    <footer>
        <p>فروشگاه گیم نت | تمامی حقوق محفوظ است</p>
    </footer>
</div>

</body>
</html>
