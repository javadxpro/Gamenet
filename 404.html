<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="صفحه‌ای که دنبالش بودید پیدا نشد — گیم نت.">
    <meta property="og:title" content="صفحه پیدا نشد | گیم نت">
    <meta property="og:description" content="صفحه‌ای که دنبالش بودید پیدا نشد — گیم نت.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <title>صفحه پیدا نشد | گیم نت</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="Webstyle.css">
    <style>
        .error-wrap {
            text-align: center;
            padding: 4rem 1rem 3rem;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #ff6a00;
            text-shadow: 0 0 30px rgba(255, 106, 0, 0.4);
            direction: ltr;
        }
        .error-text {
            color: #aaa;
            margin: 1rem 0 2rem;
            font-size: 1.1rem;
        }
        .error-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #ff6a00;
            color: #fff;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            border-radius: 1rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .error-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="error-wrap">
        <div class="error-code">404</div>
        <div class="error-text">😕 به نظر می‌رسه این صفحه جابه‌جا شده یا دیگر وجود نداره.</div>
        <a class="error-home" href="index.html"><i class="fas fa-home"></i> بازگشت به فروشگاه</a>
    </div>
    <footer>
        <p>فروشگاه گیم نت | تمامی حقوق محفوظ است</p>
    </footer>
</div>

</body>
</html>
