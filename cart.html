<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="سبد خرید فروشگاه گیم نت — بررسی اقلام، ثبت سفارش و دریافت کد پیگیری.">
    <meta property="og:title" content="سبد خرید | فروشگاه گیم نت">
    <meta property="og:description" content="سبد خرید فروشگاه گیم نت — بررسی اقلام، ثبت سفارش و دریافت کد پیگیری.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">

    <title>سبد خرید | فروشگاه گیم نت</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <link rel="stylesheet" href="Webstyle.css?v=3">
</head>
<body>

<div class="container">
    <div class="main-header">
        <div class="logo"><h1><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-store"></use></svg> فروشگاه گیم نت</h1></div>
        <a href="shop-index.html" class="back-link"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-back"></use></svg> بازگشت</a>
    </div>

    <h1 class="section-title">🛒 سبد خرید</h1>
    
    <!-- ========== لیست آیتم‌های سبد خرید ========== -->
    <div id="cartItems"></div>
    
    <!-- ========== خلاصه سبد خرید ========== -->
    <div id="cartSummary"></div>
    
    <!-- ========== دکمه ثبت سفارش ========== -->
    <button class="checkout-btn" id="checkoutBtn"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-check"></use></svg> ثبت سفارش و دریافت کد پیگیری</button>
    
    <!-- ========== کد پیگیری سفارش ========== -->
    <div id="orderCodeDiv" class="order-code" style="display: none;">
        <svg class="gi" width="1.18em" height="1.18em" aria-hidden="true" style="font-size: 1.5rem; color: #ff6a00;"><use href="icons.svg?v=3#ic-ticket"></use></svg>
        <h3>✅ کد پیگیری سفارش شما:</h3>
        <h2 id="orderCode" style="color: #ff6a00; direction: ltr; font-size: 0.9rem; word-break: break-all; background: #0a0a0f; padding: 0.5rem; border-radius: 10px;"></h2>
        <button class="copy-btn" id="copyCodeBtn"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-copy"></use></svg> کپی کد</button>
        <div id="copySuccess" class="copy-success" style="display: none;">✅ کد پیگیری کپی شد!</div>
        <div class="order-details" id="orderDetails"></div>
        <p style="font-size: 0.8rem; margin-top: 0.5rem;">📞 لطفاً با این کد با ما تماس بگیرید.</p>
    </div>

    <div class="contact-bar">
        <svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-phone"></use></svg> شماره‌های تماس برای هماهنگی:
        <a href="tel:0933880140">۰۹۳۳۸۸۰۱۴۰</a> | 
        <a href="tel:09372726142">۰۹۳۷۲۷۲۶۱۴۲</a>
    </div>

    <footer>
        <div class="owner-id"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-send"></use></svg> آیدی مدیریت: <a href="https://rubika.ir/javadxpro" target="_blank">javadxpro@</a></div>
        <p>فروشگاه گیم نت | تمامی حقوق محفوظ است</p>
    </footer>
</div>

<!-- ========== منوی پایین ========== -->
<div class="bottom-nav">
    <a href="shop-index.html"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-home"></use></svg> خانه</a>
    <a href="cart.html" class="active"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-cart"></use></svg> سبد خرید</a>
    <a href="offers.html"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-gift"></use></svg> پیشنهادها</a>
    <a href="games.html"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-gamepad"></use></svg> بازی‌ها</a>
    <a href="giftcard.html"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=3#ic-ticket"></use></svg> گیفت کارت</a>
</div>

<!-- ========== اسکریپت‌ها ========== -->
<script src="script.js?v=3"></script>

<!-- ========== اسکریپت مخصوص سبد خرید ========== -->
<script>
    // ========== توابع سبد خرید (getCart, renderCart, checkout و ...) در script.js مشترک قرار دارند ==========
    document.getElementById('checkoutBtn').addEventListener('click', checkout);
    document.getElementById('copyCodeBtn').addEventListener('click', copyOrderCode);
</script>

</body>
</html>
