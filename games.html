    // escape برای مقادیری که داخل HTML/attribute می‌روند
    function escHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderAllGames() {
        const container = document.getElementById('allGamesGrid');
        if (!container) return;

        container.innerHTML = gamesList.map((game, index) => {
            const inner = `
                <div class="img-container">
                    <img class="game-img" src="${escHtml(game.img)}" alt="${escHtml(game.title)}" loading="lazy" decoding="async" onerror="this.onerror=null; this.src='images/placeholder.svg';">
                </div>
                <div class="game-info">
                    <div class="game-title">${escHtml(game.title)}</div>
                    <div class="game-size"><svg class="gi" width="1.18em" height="1.18em" aria-hidden="true"><use href="icons.svg?v=5#ic-drive"></use></svg> حجم نصب کپی‌خور: ${escHtml(game.size)}</div>
                    <div class="platform-icons">
                        <i class="fab fa-playstation ps-icon"></i>
                    </div>
                    ${game.type ? `<div class="game-type">🎮 ${escHtml(game.type)} — فقط PS4/PS5</div>` : ''}
                    <div class="game-status ${game.status === 'موجود' ? 'available' : 'unavailable'}">
                        ${game.status === 'موجود' ? '✅ موجود — کپی‌خور ۲۵۰,۰۰۰ تومان' : '⛔ ناموجود'}
                    </div>
                    <div class="view-detail">👈 مشاهده جزئیات و خرید</div>
                </div>`;
            // بازی موجود صفحهٔ اختصاصی دارد؛ ناموجود فقط پیام نشان می‌دهد
            return game.slug
                ? `<a class="game-card" href="game-${escHtml(game.slug)}.html" aria-label="${escHtml(game.title)}">${inner}</a>`
                : `<div class="game-card" data-game-index="${index}" tabindex="0" role="button" aria-label="${escHtml(game.title)}">${inner}</div>`;
        }).join('');
    }

    function showGame(index) {
        const game = gamesList[index];
        if (!game) return;
        alert(`${game.title} - ناموجود\nبه زودی`);
    }

    document.getElementById('allGamesGrid').addEventListener('click', function(event) {
        const card = event.target.closest('[data-game-index]');
        if (card) showGame(parseInt(card.getAttribute('data-game-index'), 10));
    });
    document.getElementById('allGamesGrid').addEventListener('keydown', function(event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        const card = event.target.closest('[data-game-index]');
        if (card) { event.preventDefault(); showGame(parseInt(card.getAttribute('data-game-index'), 10)); }
    });
