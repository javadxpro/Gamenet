    function renderAllGames() {
        const container = document.getElementById('allGamesGrid');
        if (!container) return;
        
        container.innerHTML = gamesList.map(game => {
            const safeTitle = game.title.replace(/'/g, "\\'");
            const alertMsg = game.status === 'موجود' ? 'قیمت: ۱۵۰,۰۰۰ تومان' + '\\n' + 'برای خرید با پشتیبانی تماس بگیرید' : 'ناموجود' + '\\n' + 'به زودی';
            return `
            <div class="game-card" onclick="alert('${safeTitle} - ${alertMsg}')">
                <div class="img-container">
                    <img class="game-img" src="${game.img}" alt="${game.title}" onerror="this.parentElement.innerHTML='<div style=\\'width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#1a1a2e; color:#ff6a00;\\'><i class=\\'fas fa-gamepad\\' style=\\'font-size:3rem;\\'></i></div>'">
                </div>
                <div class="game-info">
                    <div class="game-title">${game.title}</div>
                    <div class="game-size"><svg class="gi" aria-hidden="true"><use href="icons.svg#ic-drive"></use></svg> ${game.size}</div>
                    <div class="platform-icons">
                        <i class="fab fa-playstation ps-icon"></i>
                        <i class="fab fa-xbox xbox-icon"></i>
                    </div>
                    ${game.type ? `<div class="game-type">🎮 ${game.type}</div>` : ''}
                    <div class="game-status ${game.status === 'موجود' ? 'available' : 'unavailable'}">
                        ${game.status === 'موجود' ? '✅ موجود - ۱۵۰,۰۰۰ تومان' : '⛔ ناموجود'}
                    </div>
                    <div class="view-detail">👈 مشاهده جزئیات و خرید</div>
                </div>
            </div>
            `;
        }).join('');
    }

    renderAllGames();
